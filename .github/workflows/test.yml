name: CI Test Suite

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest flake8

      - name: Run Syntax & Lint Checks
        run: |
          python -m py_compile release_mirror/*.py tests/*.py
          flake8 release_mirror/ tests/ --count --max-line-length=120 --statistics || true

      - name: Run Test Suite
        run: |
          pytest -v tests/
